# Profil weryfikacyjny wieloinstancyjności — patrz docs/backend/multi-instance.md §3.3.
#
# Uruchamianie:
#   docker compose -f docker-compose.yml -f docker-compose.multi.yml up
#
# CO TO JEST, A CZYM NIE JEST. To narzędzie do udowodnienia, że zmiany z faz 1–5 działają,
# a nie obraz produkcyjny. Instancje chodzą z bind-mountem repozytorium na obrazie SDK
# (`dotnet run`), bo backend nie ma dziś Dockerfile'i, a dokładanie ich tylko po to, żeby
# przetestować SKIP LOCKED, byłoby ogonem merdającym psem. Gdy Dockerfile'e powstaną, ten plik
# ma się skurczyć do `image:` + `deploy.replicas`.
#
# DLACZEGO OSOBNE `ErpBuildSlot` DLA KAŻDEJ INSTANCJI. Dwa procesy MSBuild budujące te same
# projekty z `building-blocks/` blokują sobie pliki w `obj/` — to ten sam problem, dla którego
# `Directory.Build.props` w ogóle wprowadza sloty (patrz komentarz tamże). Bez tego druga
# instancja przewraca się na „because it is being used by another process”.

name: erp

services:
  # ── Rozgrzanie cache'u pakietów ───────────────────────────────────────────────────────────
  #
  # Pięć kontenerów startujących naraz odpala pięć równoległych `dotnet restore` do JEDNEGO
  # wolumenu z pakietami. NuGet radzi sobie z równoległością w obrębie maszyny, ale rozpakowanie
  # pakietu przez pięć niezależnych kontenerów potrafi zostawić plik w połowie — objawia się to
  # błędem `Could not find file '.../acg4uxhj.h3r'` przy losowym pakiecie i losowej instancji.
  #
  # Jednorazowy krok, od którego zależą wszystkie instancje: pakiety trafiają do wolumenu RAZ,
  # a potem pięć restore'ów już tylko je czyta. Własny `ErpBuildSlot`, żeby nie pisać rootem do
  # `obj/` używanego przez build z hosta.
  restore:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: erp-restore
    working_dir: /src
    environment:
      ErpBuildSlot: restore
      DOTNET_NOLOGO: "1"
    command:
      - /bin/sh
      - -c
      - |
        set -e
        dotnet restore modules/Catalog/Catalog.Api/Catalog.Api.csproj
        dotnet restore modules/Notification/Notification.Api/Notification.Api.csproj
        dotnet restore modules/Identity/Identity.Api/Identity.Api.csproj
        echo "Cache pakietow gotowy."
    volumes:
      - .:/src
      - nuget-cache:/root/.nuget/packages
    restart: "no"

  # ── Katalog ×2 ───────────────────────────────────────────────────────────────────────────
  #
  # Weryfikuje fazę 1 (dwa BulkCommandRunner / ExportRunner nad jednym Postgresem) i fazę 3
  # (unieważnienie cache uprawnień docierające do OBU instancji).
  #
  # Migracje: `Database__MigrateOnStartup=true` na OBU — celowo. Na produkcji schemat stosuje
  # osobny krok wdrożenia, ale ten profil ma sprawdzać właśnie to, czy równoległy start kilku
  # instancji nie rozjedzie `__EFMigrationsHistory` (faza 2, dzierżawa blokująca). Wyłączenie
  # flagi zamieniłoby test w założenie i wymagałoby ręcznego kroku przed każdym `up`.
  catalog-1: &catalog
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: erp-catalog-1
    working_dir: /src/modules/Catalog/Catalog.Api
    command: ["dotnet", "run", "--no-launch-profile"]
    environment:
      ErpBuildSlot: multi1
      DOTNET_NOLOGO: "1"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CatalogDb: Host=postgres;Port=5432;Database=erp;Username=erp;Password=erp
      Database__MigrateOnStartup: "true"
      # Seed to praca startowa pod dzierżawą (faza 2) — celowo zostaje włączony na OBU
      # instancjach, bo właśnie jego równoległy start jest tu przedmiotem testu.
      Seed__Enabled: "true"
      Messaging__RabbitMqConnectionString: amqp://erp:erp@rabbitmq:5672
      Messaging__PostgresConnectionString: Host=postgres;Port=5432;Database=erp;Username=erp;Password=erp
      # Kod handlerów z zestawu, nie z Roslyna przy starcie — przy równoległym starcie kilku
      # instancji znika przy okazji wyścig na generowanym kodzie. Wymaga zatwierdzonego wyniku
      # `dotnet run -- codegen write` (patrz docs/backend/multi-instance.md §8.2).
      Messaging__PrecompiledHandlers: "true"
      Artifacts__Endpoint: minio:9000
      # Emitent w tokenie jest publiczny (localhost:8080 — tam loguje się przeglądarka),
      # a metadane serwis dociąga po sieci compose. Patrz KeycloakOptions.MetadataAddress.
      Keycloak__Authority: http://localhost:8080/realms/erp
      Keycloak__MetadataAddress: http://keycloak:8080/realms/erp/.well-known/openid-configuration
      Identity__BaseUrl: http://identity:8080
    volumes:
      - .:/src
      - nuget-cache:/root/.nuget/packages
    depends_on:
      restore:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  catalog-2:
    <<: *catalog
    container_name: erp-catalog-2
    environment:
      ErpBuildSlot: multi2
      DOTNET_NOLOGO: "1"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CatalogDb: Host=postgres;Port=5432;Database=erp;Username=erp;Password=erp
      Database__MigrateOnStartup: "true"
      Seed__Enabled: "true"
      Messaging__RabbitMqConnectionString: amqp://erp:erp@rabbitmq:5672
      Messaging__PostgresConnectionString: Host=postgres;Port=5432;Database=erp;Username=erp;Password=erp
      # Kod handlerów z zestawu, nie z Roslyna przy starcie — przy równoległym starcie kilku
      # instancji znika przy okazji wyścig na generowanym kodzie. Wymaga zatwierdzonego wyniku
      # `dotnet run -- codegen write` (patrz docs/backend/multi-instance.md §8.2).
      Messaging__PrecompiledHandlers: "true"
      Artifacts__Endpoint: minio:9000
      # Emitent w tokenie jest publiczny (localhost:8080 — tam loguje się przeglądarka),
      # a metadane serwis dociąga po sieci compose. Patrz KeycloakOptions.MetadataAddress.
      Keycloak__Authority: http://localhost:8080/realms/erp
      Keycloak__MetadataAddress: http://keycloak:8080/realms/erp/.well-known/openid-configuration
      Identity__BaseUrl: http://identity:8080

  # ── Identity ─────────────────────────────────────────────────────────────────────────────
  #
  # Jedna instancja i to wystarcza: Identity jest tu po to, żeby Catalog miał kogo zapytać
  # o uprawnienia (bez tego każdy zapis kończy się 403 i profil nie nadaje się do sprawdzenia
  # czegokolwiek poza startem). Przy okazji to Identity wypuszcza `PermissionsInvalidated`
  # na `erp.broadcast` — czyli daje się na nim sprawdzić fazę 3 na obu instancjach Catalogu.
  identity:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: erp-identity
    working_dir: /src/modules/Identity/Identity.Api
    command: ["dotnet", "run", "--no-launch-profile"]
    environment:
      ErpBuildSlot: identity
      DOTNET_NOLOGO: "1"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__IdentityDb: Host=postgres;Port=5432;Database=erp;Username=erp;Password=erp
      Database__MigrateOnStartup: "true"
      Messaging__RabbitMqConnectionString: amqp://erp:erp@rabbitmq:5672
      Messaging__PostgresConnectionString: Host=postgres;Port=5432;Database=erp;Username=erp;Password=erp
      Keycloak__Authority: http://localhost:8080/realms/erp
      Keycloak__MetadataAddress: http://keycloak:8080/realms/erp/.well-known/openid-configuration
      KeycloakAdmin__AuthServerUrl: http://keycloak:8080
      Identity__BaseUrl: http://identity:8080
    volumes:
      - .:/src
      - nuget-cache:/root/.nuget/packages
    ports:
      - "5280:8080"
    depends_on:
      restore:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ── Notification: rozdział ról (faza 4) ──────────────────────────────────────────────────
  #
  # Relay jest DOKŁADNIE JEDEN i tylko on słucha kolejki `notification.events`: koalescencja,
  # licznik sekwencji i próg „all" wymagają jednego miejsca decyzyjnego. Huby wystawiają
  # WebSockety i nie konsumują z brokera (`Messaging__ListenQueueName` puste) — inaczej
  # zdarzenia rozdzieliłyby się między nie jako competing consumers.
  notification-relay:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: erp-notification-relay
    working_dir: /src/modules/Notification/Notification.Api
    command: ["dotnet", "run", "--no-launch-profile"]
    environment:
      ErpBuildSlot: relay
      DOTNET_NOLOGO: "1"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Realtime__Role: Relay
      Identity__BaseUrl: http://identity:8080
      Realtime__Redis: redis:6379
      ConnectionStrings__NotificationDb: Host=postgres;Port=5432;Database=erp;Username=erp;Password=erp
      Database__MigrateOnStartup: "true"
      Messaging__RabbitMqConnectionString: amqp://erp:erp@rabbitmq:5672
      Messaging__PostgresConnectionString: Host=postgres;Port=5432;Database=erp;Username=erp;Password=erp
      # Kod handlerów z zestawu, nie z Roslyna przy starcie — przy równoległym starcie kilku
      # instancji znika przy okazji wyścig na generowanym kodzie. Wymaga zatwierdzonego wyniku
      # `dotnet run -- codegen write` (patrz docs/backend/multi-instance.md §8.2).
      Messaging__PrecompiledHandlers: "true"
      # Emitent w tokenie jest publiczny (localhost:8080 — tam loguje się przeglądarka),
      # a metadane serwis dociąga po sieci compose. Patrz KeycloakOptions.MetadataAddress.
      Keycloak__Authority: http://localhost:8080/realms/erp
      Keycloak__MetadataAddress: http://keycloak:8080/realms/erp/.well-known/openid-configuration
    volumes:
      - .:/src
      - nuget-cache:/root/.nuget/packages
    depends_on:
      restore:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Huby mają wystawione porty OBOK load balancera — nie po to, żeby tak chodził klient, tylko
  # żeby dało się celowo posadzić dwa połączenia na DWÓCH RÓŻNYCH instancjach. Round-robin tego
  # nie gwarantuje, a bez gwarancji test backplane'u potrafi sprawdzić zupełnie co innego:
  # dwóch klientów na jednym hubie dostaje wiadomość bez udziału Redisa.
  notification-hub-1: &hub
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: erp-notification-hub-1
    ports:
      - "5251:8080"
    working_dir: /src/modules/Notification/Notification.Api
    command: ["dotnet", "run", "--no-launch-profile"]
    environment:
      ErpBuildSlot: hub1
      DOTNET_NOLOGO: "1"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Realtime__Role: Hub
      Identity__BaseUrl: http://identity:8080
      Realtime__Redis: redis:6379
      ConnectionStrings__NotificationDb: Host=postgres;Port=5432;Database=erp;Username=erp;Password=erp
      Database__MigrateOnStartup: "true"
      Messaging__ListenQueueName: ""
      Messaging__RabbitMqConnectionString: amqp://erp:erp@rabbitmq:5672
      Messaging__PostgresConnectionString: Host=postgres;Port=5432;Database=erp;Username=erp;Password=erp
      # Kod handlerów z zestawu, nie z Roslyna przy starcie — przy równoległym starcie kilku
      # instancji znika przy okazji wyścig na generowanym kodzie. Wymaga zatwierdzonego wyniku
      # `dotnet run -- codegen write` (patrz docs/backend/multi-instance.md §8.2).
      Messaging__PrecompiledHandlers: "true"
      # Emitent w tokenie jest publiczny (localhost:8080 — tam loguje się przeglądarka),
      # a metadane serwis dociąga po sieci compose. Patrz KeycloakOptions.MetadataAddress.
      Keycloak__Authority: http://localhost:8080/realms/erp
      Keycloak__MetadataAddress: http://keycloak:8080/realms/erp/.well-known/openid-configuration
    volumes:
      - .:/src
      - nuget-cache:/root/.nuget/packages
    depends_on:
      restore:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification-hub-2:
    <<: *hub
    container_name: erp-notification-hub-2
    ports:
      - "5252:8080"
    environment:
      ErpBuildSlot: hub2
      DOTNET_NOLOGO: "1"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Realtime__Role: Hub
      Identity__BaseUrl: http://identity:8080
      Realtime__Redis: redis:6379
      ConnectionStrings__NotificationDb: Host=postgres;Port=5432;Database=erp;Username=erp;Password=erp
      Database__MigrateOnStartup: "true"
      Messaging__ListenQueueName: ""
      Messaging__RabbitMqConnectionString: amqp://erp:erp@rabbitmq:5672
      Messaging__PostgresConnectionString: Host=postgres;Port=5432;Database=erp;Username=erp;Password=erp
      # Kod handlerów z zestawu, nie z Roslyna przy starcie — przy równoległym starcie kilku
      # instancji znika przy okazji wyścig na generowanym kodzie. Wymaga zatwierdzonego wyniku
      # `dotnet run -- codegen write` (patrz docs/backend/multi-instance.md §8.2).
      Messaging__PrecompiledHandlers: "true"
      # Emitent w tokenie jest publiczny (localhost:8080 — tam loguje się przeglądarka),
      # a metadane serwis dociąga po sieci compose. Patrz KeycloakOptions.MetadataAddress.
      Keycloak__Authority: http://localhost:8080/realms/erp
      Keycloak__MetadataAddress: http://keycloak:8080/realms/erp/.well-known/openid-configuration

  # ── Keycloak: stały, publiczny emitent ───────────────────────────────────────────────────
  #
  # Bez `KC_HOSTNAME` Keycloak wystawia `iss` zgodny z hostem żądania: token wzięty z przeglądarki
  # ma `http://localhost:8080/...`, a serwis w kontenerze ufa `http://keycloak:8080/...` i odrzuca
  # go z 401. Przypięcie adresu publicznego sprawia, że emitent jest JEDEN dla wszystkich, a różnicę
  # w dostępie sieciowym zdejmuje `Keycloak__MetadataAddress` po stronie serwisów.
  keycloak:
    environment:
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"

  # ── Redis: WYŁĄCZNIE backplane SignalR ───────────────────────────────────────────────────
  #
  # Jedyna rzecz, której Postgres nie potrafi zrobić — SignalR nie ma backplane'u na Postgresie.
  # Dzierżawy, licznik sekwencji i koordynacja startu idą przez Postgresa (multi-instance.md §1).
  # Nie dokładaj tu cache'a uprawnień ani kolejek: awaria Redisa ma degradować realtime,
  # a nie kłaść autoryzację całego ERP.
  redis:
    image: redis:7-alpine
    container_name: erp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Load balancer ────────────────────────────────────────────────────────────────────────
  #
  # Bez powinowactwa sesji — i to jest przedmiot testu, nie niedopatrzenie. Front łączy się
  # z `skipNegotiation: true`, więc SignalR nie zostawia stanu do przyklejenia (§7.4).
  # `proxy_read_timeout` na 1h: domyślne 60 s zrywałoby bezczynne WebSockety i test resyncu
  # mierzyłby nginxa zamiast aplikacji.
  #
  # UWAGA PRZY PONOWNYM STAWIANIU POJEDYNCZEJ INSTANCJI: nginx zapamiętuje adresy IP backendów
  # przy starcie, a odtworzony kontener dostaje nowy adres. Po `--force-recreate` któregokolwiek
  # serwisu zrestartuj też nginxa — szczegóły w nagłówku ./nginx/multi.conf.
  nginx:
    image: nginx:1.27-alpine
    container_name: erp-nginx
    restart: unless-stopped
    ports:
      - "5149:5149"   # Catalog — ten sam port co pojedyncza instancja z hosta
      - "5250:5250"   # Notification (huby)
    volumes:
      - ./nginx/multi.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - catalog-1
      - catalog-2
      - notification-hub-1
      - notification-hub-2

volumes:
  nuget-cache:
