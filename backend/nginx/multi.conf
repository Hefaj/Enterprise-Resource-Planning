# Load balancer profilu wieloinstancyjnego (docker-compose.multi.yml).
#
# CELOWO BEZ `ip_hash` / `sticky`. Powinowactwo sesji ukryłoby dokładnie te błędy, których
# szukamy: cache uprawnień unieważniony tylko w jednym procesie (faza 3) i połączenie SignalR
# wymagające tej samej instancji co negocjacja (faza 4). Round-robin rozrzuca żądania po
# instancjach i tym samym zamienia te usterki z „czasem się zdarza" w powtarzalne.

# ⚠ NGINX ROZWIĄZUJE NAZWY UPSTREAMÓW RAZ, PRZY STARCIE — i trzyma adresy IP do końca życia
# procesu. Docker przydziela kontenerowi nowy adres przy każdym odtworzeniu, więc po
# `docker compose up -d --force-recreate catalog-1` nginx nadal celuje w stary adres, który
# w międzyczasie bywa już zajęty przez INNY kontener. Objaw jest mylący: żądania wracają
# z odpowiedzią, tylko nie z tej usługi, o którą prosiliśmy.
#
# Po każdym odtworzeniu instancji: `docker compose ... restart nginx`. Wariant z `resolver`
# i zmienną w `proxy_pass` odświeżałby adresy sam, ale kosztem rozkładania ruchu na dwie
# instancje — czyli tego, po co ten load balancer tutaj w ogóle stoi.

# Log z adresem backendu, który faktycznie obsłużył żądanie. Bez tego nie da się odpowiedzieć
# na jedyne pytanie, które przy tym profilu naprawdę się liczy: „czy te dwa połączenia poszły
# na dwie różne instancje" — a to od tego zależy, czy backplane jest w ogóle sprawdzany.
log_format erp_upstream '$remote_addr "$request" $status -> $upstream_addr';
access_log /var/log/nginx/access.log erp_upstream;

upstream catalog {
    server catalog-1:8080;
    server catalog-2:8080;
}

upstream notification {
    server notification-hub-1:8080;
    server notification-hub-2:8080;
}

server {
    listen 5149;

    location / {
        proxy_pass http://catalog;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 5250;

    location / {
        proxy_pass http://notification;
        proxy_http_version 1.1;

        # Podniesienie do WebSocketu. Bez tych dwóch nagłówków `/hubs/sync` odpowiada 400,
        # a przy `skipNegotiation: true` na froncie nie ma fallbacku, który by to przykrył.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
