# Load balancer profilu wieloinstancyjnego (docker-compose.multi.yml).
#
# CELOWO BEZ `ip_hash` / `sticky`. Powinowactwo sesji ukryłoby dokładnie te błędy, których
# szukamy: cache uprawnień unieważniony tylko w jednym procesie (faza 3) i połączenie SignalR
# wymagające tej samej instancji co negocjacja (faza 4). Round-robin rozrzuca żądania po
# instancjach i tym samym zamienia te usterki z „czasem się zdarza" w powtarzalne.

upstream catalog {
    server catalog-1:8080;
    server catalog-2:8080;
}

upstream notification {
    server notification-hub-1:8080;
    server notification-hub-2:8080;
}

server {
    listen 5149;

    location / {
        proxy_pass http://catalog;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 5250;

    location / {
        proxy_pass http://notification;
        proxy_http_version 1.1;

        # Podniesienie do WebSocketu. Bez tych dwóch nagłówków `/hubs/sync` odpowiada 400,
        # a przy `skipNegotiation: true` na froncie nie ma fallbacku, który by to przykrył.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
