name: erp

services:
  postgres:
    image: postgres:17-alpine
    container_name: erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      # Jedna baza, schemat per moduł (catalog, notification, sales, keycloak) — schematy
      # zakłada migracja każdego modułu (albo Keycloaka), nie ten plik.
      POSTGRES_DB: erp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Tylko na pustym wolumenie — na istniejącym dev-wolumenie uruchom raz ręcznie:
      # docker exec erp-postgres psql -U erp -d erp -c "CREATE SCHEMA IF NOT EXISTS keycloak;"
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: erp-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: erp
      RABBITMQ_DEFAULT_PASS: erp
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI — http://localhost:15672 (erp/erp)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Magazyn artefaktów (API zgodne z S3) — pliki produkowane przez eksporty i raporty.
  # Patrz docs/backend/exports-artifacts.md. Bajty NIE idą do Postgresa: `bytea` pompowałby
  # bazę i każdy backup o wolumen plików, których nikt nie czyta po tygodniu.
  #
  # Porty 9100/9101 zamiast domyślnych 9000/9001: 9000 jest gęsto zajętym portem na maszynach
  # deweloperskich (bierze go m.in. wewnętrzny endpoint zarządzania Keycloaka i rozmaite agenty),
  # a kolizja objawia się wyłącznie tym, że kontener nie wstaje. Wewnątrz sieci compose MinIO
  # nadal słucha na 9000 — przesunięte jest tylko mapowanie na hosta.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: erp-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: erp
      MINIO_ROOT_PASSWORD: erp12345
      MINIO_DOMAIN: localhost
    ports:
      - "9100:9000"   # API S3 — ErpArtifactOptions:Endpoint
      - "9101:9001"   # konsola webowa — http://localhost:9101 (erp/erp12345)
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Czysty IdP — uwierzytelnianie (hasła, MFA, sesje, SSO). Autoryzacja (role, uprawnienia)
  # żyje w mikroserwisie Identity, nie tutaj — patrz docs/backend/identity-authz.md.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: erp-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/erp
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: erp
      KC_DB_PASSWORD: erp
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"   # http://localhost:8080 — admin console (admin/admin), realm "erp"
    volumes:
      - ./keycloak/realm-erp.json:/opt/keycloak/data/import/realm-erp.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep 'UP' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:
